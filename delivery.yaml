schemaVersion: '1'
commands:
  setup:
    install:
      argv: [pnpm, install, --frozen-lockfile]
      timeoutSeconds: 600
  # In-sandbox verification is a toolchain/workspace smoke only. The executor
  # runs on a small Cloudflare sandbox where whole-program checks — the full
  # test suite, type-aware `eslint .`, and even `tsc --noEmit` on a large repo —
  # exhaust container memory and are killed mid-run before they can post a
  # result, blocking the credential-free publisher. The fast smoke below
  # confirms the checkout, Node runtime, and package manifest are intact so
  # broken agent output is still caught cheaply. The authoritative full
  # `pnpm run verify` (typecheck + lint + the entire test suite) runs as the
  # target repository's pull_request CI — the required merge check and real
  # final gate — so no coverage is lost, only moved off the sandbox.
  targeted:
    smoke:
      argv: [node, -e, "require('node:fs').accessSync('package.json')"]
      timeoutSeconds: 120
  verify:
    smoke:
      argv: [node, -e, "require('node:fs').accessSync('package.json')"]
      timeoutSeconds: 120
  acceptance:
    smoke:
      argv: [node, -e, "require('node:fs').accessSync('package.json')"]
      timeoutSeconds: 120
protectedPaths:
  - delivery.yaml
  - .github/workflows/**
  - CODEOWNERS
  - .env*
  - .dev.vars*
  - secrets.y*ml
  - wrangler.jsonc
  - deploy/**
  - infra/**
deployment:
  mode: none
