schemaVersion: '1'
commands:
  setup:
    install:
      argv: [pnpm, install, --frozen-lockfile]
      timeoutSeconds: 600
  # In-sandbox verification stays lightweight: the executor runs on a small
  # Cloudflare sandbox where the full unit/verify suites — and type-aware
  # `eslint .` (which loads the whole TypeScript program and OOMs/hangs the
  # sandbox before it can post a result) — do not complete. Both the fast
  # targeted check and the required publisher verify therefore run
  # `tsc --noEmit`, which finishes in seconds and catches broken agent output.
  # The authoritative full `pnpm run verify` (lint + the entire test suite)
  # runs as the target repository's pull_request CI, the required merge check
  # and real final gate.
  targeted:
    typecheck:
      argv: [pnpm, run, typecheck]
      timeoutSeconds: 300
  verify:
    typecheck:
      argv: [pnpm, run, typecheck]
      timeoutSeconds: 300
  acceptance:
    smoke:
      argv: [pnpm, run, typecheck]
      timeoutSeconds: 300
protectedPaths:
  - delivery.yaml
  - .github/workflows/**
  - CODEOWNERS
  - .env*
  - .dev.vars*
  - secrets.y*ml
  - wrangler.jsonc
  - deploy/**
  - infra/**
deployment:
  mode: none
