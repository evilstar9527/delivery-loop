name: Codex provider preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-provider-preflight
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact provider route
        env:
          DELIVERY_LOOP_CODEX_ADAPTER_E2E: '1'
          DELIVERY_LOOP_CODEX_ADAPTER_MODEL: gpt-5.6-terra
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: pnpm run e2e:codex-adapter > "$RUNNER_TEMP/codex-provider-preflight.json"
