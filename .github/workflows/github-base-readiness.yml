name: GitHub base readiness

on:
  workflow_dispatch:
    inputs:
      diagnostic_run_id:
        description: Optional exact Run ID for a read-only open dead-letter diagnostic
        required: false
        default: ''
        type: string
      approval_run_id:
        description: Optional exact Run ID for a repo-write comment observation
        required: false
        default: ''
        type: string
      approval_comment_id:
        description: Optional exact GitHub commit comment ID for repo-write approval
        required: false
        default: ''
        type: string
      replay_dead_letter_id:
        description: Optional exact workflow outbox dead-letter ID to replay
        required: false
        default: ''
        type: string
      replay_expected_outbox_attempt_count:
        description: Exact outbox attempt count bound to the dead letter
        required: false
        default: ''
        type: string
      replay_reason_code:
        description: Fixed replay reason code
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: phase1-github-base-readiness
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.repository == 'evilstar9527/delivery-loop' &&
      github.ref == 'refs/heads/main' && github.actor == 'evilstar9527' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trusted main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate requested operation
        env:
          DELIVERY_DIAGNOSTIC_RUN_ID: ${{ inputs.diagnostic_run_id }}
          DELIVERY_APPROVAL_RUN_ID: ${{ inputs.approval_run_id }}
          DELIVERY_APPROVAL_COMMENT_ID: ${{ inputs.approval_comment_id }}
          DELIVERY_REPLAY_DEAD_LETTER_ID: ${{ inputs.replay_dead_letter_id }}
          DELIVERY_REPLAY_EXPECTED_OUTBOX_ATTEMPT_COUNT: ${{ inputs.replay_expected_outbox_attempt_count }}
          DELIVERY_REPLAY_REASON_CODE: ${{ inputs.replay_reason_code }}
        run: |
          set -euo pipefail
          modes=0
          if test -z "$DELIVERY_DIAGNOSTIC_RUN_ID" \
            && test -z "$DELIVERY_APPROVAL_RUN_ID" \
            && test -z "$DELIVERY_APPROVAL_COMMENT_ID" \
            && test -z "$DELIVERY_REPLAY_DEAD_LETTER_ID" \
            && test -z "$DELIVERY_REPLAY_EXPECTED_OUTBOX_ATTEMPT_COUNT" \
            && test -z "$DELIVERY_REPLAY_REASON_CODE"; then
            modes=$((modes + 1))
          fi
          if test -n "$DELIVERY_DIAGNOSTIC_RUN_ID" \
            && test -z "$DELIVERY_APPROVAL_RUN_ID" \
            && test -z "$DELIVERY_APPROVAL_COMMENT_ID" \
            && test -z "$DELIVERY_REPLAY_DEAD_LETTER_ID" \
            && test -z "$DELIVERY_REPLAY_EXPECTED_OUTBOX_ATTEMPT_COUNT" \
            && test -z "$DELIVERY_REPLAY_REASON_CODE"; then
            modes=$((modes + 1))
          fi
          if test -z "$DELIVERY_DIAGNOSTIC_RUN_ID" \
            && test -n "$DELIVERY_APPROVAL_RUN_ID" \
            && test -n "$DELIVERY_APPROVAL_COMMENT_ID" \
            && test -z "$DELIVERY_REPLAY_DEAD_LETTER_ID" \
            && test -z "$DELIVERY_REPLAY_EXPECTED_OUTBOX_ATTEMPT_COUNT" \
            && test -z "$DELIVERY_REPLAY_REASON_CODE"; then
            modes=$((modes + 1))
          fi
          if test -z "$DELIVERY_DIAGNOSTIC_RUN_ID" \
            && test -z "$DELIVERY_APPROVAL_RUN_ID" \
            && test -z "$DELIVERY_APPROVAL_COMMENT_ID" \
            && test -n "$DELIVERY_REPLAY_DEAD_LETTER_ID" \
            && test -n "$DELIVERY_REPLAY_EXPECTED_OUTBOX_ATTEMPT_COUNT" \
            && test -n "$DELIVERY_REPLAY_REASON_CODE"; then
            modes=$((modes + 1))
          fi
          test "$modes" = 1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Probe control-plane network path
        env:
          DELIVERY_LOOP_PROVIDER_NETWORK_PREFLIGHT: '1'
          OPENAI_BASE_URL: https://delivery-loop-control-plane.eve55265.workers.dev
        run: pnpm run e2e:provider-network

  readiness:
    needs: preflight
    if: >-
      github.repository == 'evilstar9527/delivery-loop' &&
      github.ref == 'refs/heads/main' && github.actor == 'evilstar9527' &&
      github.run_attempt == 1
    environment: phase1-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trusted main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run exactly one GitHub base readiness GET
        if: >-
          inputs.diagnostic_run_id == '' && inputs.approval_run_id == '' &&
          inputs.approval_comment_id == '' && inputs.replay_dead_letter_id == '' &&
          inputs.replay_expected_outbox_attempt_count == '' && inputs.replay_reason_code == ''
        env:
          DELIVERY_LOOP_GITHUB_BASE_READINESS: '1'
          GITHUB_BASE_READINESS_CONTROL_PLANE_URL: https://delivery-loop-control-plane.eve55265.workers.dev
          GITHUB_BASE_READINESS_OPERATIONS_TOKEN: ${{ secrets.DELIVERY_LOOP_BASE_READINESS_OPERATIONS_TOKEN }}
          GITHUB_BASE_READINESS_REPOSITORY: evilstar9527/delivery-loop
          GITHUB_BASE_READINESS_BASE_BRANCH: main
        run: pnpm run ops:github-base-readiness

      - name: Query one exact open workflow-create dead letter
        if: >-
          inputs.diagnostic_run_id != '' && inputs.approval_run_id == '' &&
          inputs.approval_comment_id == '' && inputs.replay_dead_letter_id == '' &&
          inputs.replay_expected_outbox_attempt_count == '' && inputs.replay_reason_code == ''
        env:
          DELIVERY_DIAGNOSTIC_RUN_ID: ${{ inputs.diagnostic_run_id }}
          DELIVERY_OPERATIONS_TOKEN: ${{ secrets.DELIVERY_LOOP_BASE_READINESS_OPERATIONS_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$DELIVERY_DIAGNOSTIC_RUN_ID" =~ ^run_[a-f0-9]{56}$ ]]
          response_file="$RUNNER_TEMP/open-dead-letters.json"
          status="$(curl --silent --show-error --max-time 30 \
            --url 'https://delivery-loop-control-plane.eve55265.workers.dev/v1/dead-letters?status=open&limit=100' \
            --header "Authorization: Bearer $DELIVERY_OPERATIONS_TOKEN" \
            --header 'Accept: application/json' \
            --output "$response_file" \
            --write-out '%{http_code}')"
          test "$status" = 200
          jq -e \
            --arg run_id "$DELIVERY_DIAGNOSTIC_RUN_ID" \
            '[.deadLetters[] | select(
              .runId == $run_id
              and .outboxKind == "workflow_create"
              and .status == "open"
            )] as $matches
            | select($matches | length == 1)
            | $matches[0]
            | {
                deadLetterId: .id,
                outboxAttemptCount,
                lastErrorCode: (.lastErrorCode // null),
                status
              }' \
            "$response_file"

      - name: Observe one exact GitHub repo-write approval comment
        if: >-
          inputs.diagnostic_run_id == '' && inputs.approval_run_id != '' &&
          inputs.approval_comment_id != '' && inputs.replay_dead_letter_id == '' &&
          inputs.replay_expected_outbox_attempt_count == '' && inputs.replay_reason_code == ''
        env:
          DELIVERY_APPROVAL_RUN_ID: ${{ inputs.approval_run_id }}
          DELIVERY_APPROVAL_COMMENT_ID: ${{ inputs.approval_comment_id }}
          DELIVERY_OPERATIONS_TOKEN: ${{ secrets.DELIVERY_LOOP_BASE_READINESS_OPERATIONS_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$DELIVERY_APPROVAL_RUN_ID" =~ ^run_[a-f0-9]{56}$ ]]
          [[ "$DELIVERY_APPROVAL_COMMENT_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          request_file="$RUNNER_TEMP/repo-write-approval-request.json"
          response_file="$RUNNER_TEMP/repo-write-approval-response.json"
          jq -n --argjson commentId "$DELIVERY_APPROVAL_COMMENT_ID" \
            '{commentId:$commentId}' > "$request_file"
          chmod 600 "$request_file"
          status="$(curl --silent --show-error --max-time 30 \
            --url "https://delivery-loop-control-plane.eve55265.workers.dev/v1/runs/$DELIVERY_APPROVAL_RUN_ID/github-commit-approvals" \
            --request POST \
            --header "Authorization: Bearer $DELIVERY_OPERATIONS_TOKEN" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data-binary "@$request_file" \
            --output "$response_file" \
            --write-out '%{http_code}')"
          test "$status" = 200 || test "$status" = 201
          jq -e '
            select(
              .status == "accepted"
              and (.approvalId | test("^approval_[A-Za-z0-9_-]+$"))
              and (.lineageId | test("^approval_lineage_[A-Za-z0-9_-]+$"))
            )
            | {status, approvalId, lineageId, created}
          ' "$response_file"

      - name: Replay one exact workflow outbox dead letter
        if: >-
          inputs.diagnostic_run_id == '' && inputs.approval_run_id == '' &&
          inputs.approval_comment_id == '' && inputs.replay_dead_letter_id != '' &&
          inputs.replay_expected_outbox_attempt_count != '' && inputs.replay_reason_code != ''
        env:
          DELIVERY_REPLAY_DEAD_LETTER_ID: ${{ inputs.replay_dead_letter_id }}
          DELIVERY_REPLAY_EXPECTED_OUTBOX_ATTEMPT_COUNT: ${{ inputs.replay_expected_outbox_attempt_count }}
          DELIVERY_REPLAY_REASON_CODE: ${{ inputs.replay_reason_code }}
          DELIVERY_OPERATIONS_TOKEN: ${{ secrets.DELIVERY_LOOP_BASE_READINESS_OPERATIONS_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$DELIVERY_REPLAY_DEAD_LETTER_ID" =~ ^outbox-dlq-[a-f0-9]{64}$ ]]
          [[ "$DELIVERY_REPLAY_EXPECTED_OUTBOX_ATTEMPT_COUNT" =~ ^[1-9][0-9]{0,9}$ ]]
          case "$DELIVERY_REPLAY_REASON_CODE" in
            operator_retry|upstream_recovered|configuration_fixed) ;;
            *) exit 2 ;;
          esac
          request_file="$RUNNER_TEMP/dead-letter-replay-request.json"
          response_file="$RUNNER_TEMP/dead-letter-replay-response.json"
          jq -n \
            --argjson expectedOutboxAttemptCount "$DELIVERY_REPLAY_EXPECTED_OUTBOX_ATTEMPT_COUNT" \
            --arg reasonCode "$DELIVERY_REPLAY_REASON_CODE" \
            '{expectedOutboxAttemptCount:$expectedOutboxAttemptCount,reasonCode:$reasonCode}' \
            > "$request_file"
          chmod 600 "$request_file"
          status="$(curl --silent --show-error --max-time 30 \
            --url "https://delivery-loop-control-plane.eve55265.workers.dev/v1/dead-letters/$DELIVERY_REPLAY_DEAD_LETTER_ID/replay" \
            --request POST \
            --header "Authorization: Bearer $DELIVERY_OPERATIONS_TOKEN" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data-binary "@$request_file" \
            --output "$response_file" \
            --write-out '%{http_code}')"
          test "$status" = 202
          jq -e '
            select(
              .accepted == true
              and .status == "replay_requested"
              and (.deadLetterId | test("^outbox-dlq-[a-f0-9]{64}$"))
              and (.outboxId | test("^[A-Za-z0-9][A-Za-z0-9_-]{0,255}$"))
              and (.replayId | test("^outbox-dlq-replay-[A-Za-z0-9_-]+$"))
              and (.created | type == "boolean")
            )
            | {accepted, deadLetterId, replayId, status, created}
          ' "$response_file"
