name: GitHub base readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-github-base-readiness
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.repository == 'evilstar9527/delivery-loop' &&
      github.ref == 'refs/heads/main' && github.actor == 'evilstar9527' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trusted main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Probe control-plane network path
        env:
          DELIVERY_LOOP_PROVIDER_NETWORK_PREFLIGHT: '1'
          OPENAI_BASE_URL: https://delivery-loop-control-plane.eve55265.workers.dev
        run: pnpm run e2e:provider-network

  readiness:
    needs: preflight
    if: >-
      github.repository == 'evilstar9527/delivery-loop' &&
      github.ref == 'refs/heads/main' && github.actor == 'evilstar9527' &&
      github.run_attempt == 1
    environment: phase1-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trusted main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run exactly one GitHub base readiness GET
        env:
          DELIVERY_LOOP_GITHUB_BASE_READINESS: '1'
          GITHUB_BASE_READINESS_CONTROL_PLANE_URL: https://delivery-loop-control-plane.eve55265.workers.dev
          GITHUB_BASE_READINESS_OPERATIONS_TOKEN: ${{ secrets.GITHUB_BASE_READINESS_OPERATIONS_TOKEN }}
          GITHUB_BASE_READINESS_REPOSITORY: evilstar9527/delivery-loop
          GITHUB_BASE_READINESS_BASE_BRANCH: main
        run: pnpm run ops:github-base-readiness
