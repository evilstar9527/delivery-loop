name: Validate task contract

on:
  workflow_dispatch:
    inputs:
      task_json:
        description: TaskEnvelope v1 JSON (contract validation only)
        required: true
        type: string
      intake:
        description: Submit the validated envelope to the production control plane
        required: false
        default: false
        type: boolean
      status_run_id:
        description: Optional allowlisted control-plane Run projection to query
        required: false
        default: ''
        type: string
      cancel_run_id:
        description: Optional exact Run to cancel through the control-plane CAS API
        required: false
        default: ''
        type: string
      cancel_expected_version:
        description: Expected Run version for cancellation
        required: false
        default: ''
        type: string
      cancel_expected_base_sha:
        description: Expected frozen base SHA for cancellation
        required: false
        default: ''
        type: string
      cancel_expected_plan_digest:
        description: Expected active Plan digest for cancellation
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate without printing the task body
        run: pnpm validate:task
      - name: Intake validated task without printing the task body
        if: inputs.intake
        env:
          DELIVERY_TASK_JSON: ${{ inputs.task_json }}
          DELIVERY_TASK_INTAKE_TOKEN: ${{ secrets.TASK_INTAKE_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/task-intake-response.json"
          status="$(curl --silent --show-error --max-time 30 \
            --request POST \
            --url https://delivery-loop-control-plane.eve55265.workers.dev/v1/tasks \
            --header "Authorization: Bearer $DELIVERY_TASK_INTAKE_TOKEN" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "Idempotency-Key: task-intake-$GITHUB_RUN_ID" \
            --data-binary "$DELIVERY_TASK_JSON" \
            --output "$response_file" \
            --write-out '%{http_code}')"
          test "$status" = 202
          jq -e '{accepted, taskId, runId} | select(.accepted == true)' "$response_file"
      - name: Query allowlisted run status without printing task or Plan prose
        if: inputs.status_run_id != ''
        env:
          DELIVERY_STATUS_RUN_ID: ${{ inputs.status_run_id }}
          DELIVERY_TASK_INTAKE_TOKEN: ${{ secrets.TASK_INTAKE_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$DELIVERY_STATUS_RUN_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,199}$ ]]
          response_file="$RUNNER_TEMP/run-status-response.json"
          status="$(curl --silent --show-error --max-time 30 \
            --url "https://delivery-loop-control-plane.eve55265.workers.dev/v1/runs/$DELIVERY_STATUS_RUN_ID/plan" \
            --header "Authorization: Bearer $DELIVERY_TASK_INTAKE_TOKEN" \
            --header 'Accept: application/json' \
            --output "$response_file" \
            --write-out '%{http_code}')"
          test "$status" = 200
          jq -e '{
            run: {
              id: .run.id,
              state: .run.state,
              version: .run.version,
              baseSha: .run.baseSha,
              activePlan: .run.activePlan,
              blocker: .run.blocker
            },
            plan: (
              if .plan == null then null else {
                id: .plan.id,
                version: .plan.version,
                digest: .plan.digest,
                status: .plan.status,
                baseSha: .plan.baseSha
              } end
            ),
            items: [.items[] | {
              id,
              kind,
              required,
              status,
              effects,
              commandRefs,
              evidenceKinds
            }],
            attempts: [.attempts[] | {
              id,
              mode,
              status,
              baseSha,
              githubRunId,
              githubStatus,
              githubConclusion
            }]
          }' "$response_file"
      - name: Cancel only the exact stale awaiting-approval Run
        if: inputs.cancel_run_id != ''
        env:
          DELIVERY_CANCEL_RUN_ID: ${{ inputs.cancel_run_id }}
          DELIVERY_CANCEL_EXPECTED_VERSION: ${{ inputs.cancel_expected_version }}
          DELIVERY_CANCEL_EXPECTED_BASE_SHA: ${{ inputs.cancel_expected_base_sha }}
          DELIVERY_CANCEL_EXPECTED_PLAN_DIGEST: ${{ inputs.cancel_expected_plan_digest }}
          DELIVERY_TASK_INTAKE_TOKEN: ${{ secrets.TASK_INTAKE_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$DELIVERY_CANCEL_RUN_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,199}$ ]]
          [[ "$DELIVERY_CANCEL_EXPECTED_VERSION" =~ ^[0-9]+$ ]]
          [[ "$DELIVERY_CANCEL_EXPECTED_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DELIVERY_CANCEL_EXPECTED_PLAN_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          before_file="$RUNNER_TEMP/cancel-before.json"
          before_status="$(curl --silent --show-error --max-time 30 \
            --url "https://delivery-loop-control-plane.eve55265.workers.dev/v1/runs/$DELIVERY_CANCEL_RUN_ID/plan" \
            --header "Authorization: Bearer $DELIVERY_TASK_INTAKE_TOKEN" \
            --header 'Accept: application/json' \
            --output "$before_file" \
            --write-out '%{http_code}')"
          test "$before_status" = 200
          jq -e \
            --arg run_id "$DELIVERY_CANCEL_RUN_ID" \
            --argjson version "$DELIVERY_CANCEL_EXPECTED_VERSION" \
            --arg base_sha "$DELIVERY_CANCEL_EXPECTED_BASE_SHA" \
            --arg plan_digest "$DELIVERY_CANCEL_EXPECTED_PLAN_DIGEST" \
            '.run.id == $run_id
              and .run.state == "awaiting_approval"
              and .run.version == $version
              and .run.baseSha == $base_sha
              and .plan.digest == $plan_digest
              and ([.attempts[] | select(.status == "pending" or .status == "starting" or .status == "running" or .status == "cancel_requested")] | length) == 0' \
            "$before_file"
          cancel_file="$RUNNER_TEMP/cancel-response.json"
          cancel_status="$(curl --silent --show-error --max-time 30 \
            --request POST \
            --url "https://delivery-loop-control-plane.eve55265.workers.dev/v1/runs/$DELIVERY_CANCEL_RUN_ID/cancel" \
            --header "Authorization: Bearer $DELIVERY_TASK_INTAKE_TOKEN" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data-binary "{\"expectedRunVersion\":$DELIVERY_CANCEL_EXPECTED_VERSION}" \
            --output "$cancel_file" \
            --write-out '%{http_code}')"
          test "$cancel_status" = 202
          jq -e '{accepted,runId,state,version,revokedAttempts,workflowCancelOutboxId}
            | select(.accepted == true and .state == "cancelled")' "$cancel_file"
