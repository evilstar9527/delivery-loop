name: Validate task contract

on:
  workflow_dispatch:
    inputs:
      task_json:
        description: TaskEnvelope v1 JSON (contract validation only)
        required: true
        type: string
      expected_task_id:
        description: Expected deterministic Task ID for the one-shot intake guard
        required: true
        type: string
      idempotency_key:
        description: Fresh one-shot intake idempotency key
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate without printing the task body
        run: pnpm validate:task
      - name: Read exact safe Task and Plan projections
        env:
          DELIVERY_EXPECTED_TASK_ID: ${{ inputs.expected_task_id }}
          DELIVERY_CONTROL_PLANE_ORIGIN: https://delivery-loop-control-plane.eve55265.workers.dev
          DELIVERY_TASK_INTAKE_TOKEN: ${{ secrets.TASK_INTAKE_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$DELIVERY_EXPECTED_TASK_ID" =~ ^task_[a-f0-9]{56}$ ]]
          test -n "$DELIVERY_TASK_INTAKE_TOKEN"
          run_id="run_${DELIVERY_EXPECTED_TASK_ID#task_}"
          task_response="$RUNNER_TEMP/task-safe.json"
          plan_response="$RUNNER_TEMP/plan-safe.json"
          template_response="$RUNNER_TEMP/template-safe.json"
          task_status="$(curl --silent --show-error --max-time 20 \
            --output "$task_response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $DELIVERY_TASK_INTAKE_TOKEN" \
            --header 'Accept: application/json' \
            "$DELIVERY_CONTROL_PLANE_ORIGIN/v1/tasks/$DELIVERY_EXPECTED_TASK_ID")"
          plan_status="$(curl --silent --show-error --max-time 20 \
            --output "$plan_response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $DELIVERY_TASK_INTAKE_TOKEN" \
            --header 'Accept: application/json' \
            "$DELIVERY_CONTROL_PLANE_ORIGIN/v1/runs/$run_id/plan")"
          template_status="$(curl --silent --show-error --max-time 20 \
            --output "$template_response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $DELIVERY_TASK_INTAKE_TOKEN" \
            --header 'Accept: application/json' \
            "$DELIVERY_CONTROL_PLANE_ORIGIN/v1/runs/$run_id/github-commit-approval-template")"
          test "$task_status" = 200
          test "$plan_status" = 200
          jq -n --arg operationsTemplateStatus "$template_status" \
            '{operationsTemplateStatus:$operationsTemplateStatus}'
          jq -ce --arg task_id "$DELIVERY_EXPECTED_TASK_ID" --arg run_id "$run_id" '
            select(.task.id == $task_id and .run.id == $run_id)
            | {task:{id:.task.id, source:.task.source, target:.task.target,
                intent:{kind:.task.intent.kind}}, run:.run}
          ' "$task_response"
          jq -ce --arg run_id "$run_id" '
            select(.run.id == $run_id)
            | {run:.run, plan:.plan, items:[.items[] | {
                id, kind, required, status, progressVersion, effects,
                commandRefs, evidenceKinds, activeAttemptId
              }], attempts:[.attempts[] | {
                id, mode, status, planItemId, githubRunId,
                githubStatus, githubConclusion, version, leaseGeneration
              }]}
          ' "$plan_response"
