name: Validate task contract

on:
  workflow_dispatch:
    inputs:
      task_json:
        description: TaskEnvelope v1 JSON (contract validation only)
        required: false
        default: ''
        type: string
      expected_task_id:
        description: Expected deterministic Task ID for the one-shot intake guard
        required: false
        default: ''
        type: string
      idempotency_key:
        description: Fresh one-shot intake idempotency key
        required: false
        default: ''
        type: string
      query_task_id:
        description: Optional exact Task ID for a read-only safe state projection
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate requested operation
        env:
          DELIVERY_TASK_JSON: ${{ inputs.task_json }}
          DELIVERY_EXPECTED_TASK_ID: ${{ inputs.expected_task_id }}
          DELIVERY_IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          DELIVERY_QUERY_TASK_ID: ${{ inputs.query_task_id }}
        run: |
          set -euo pipefail
          modes=0
          if test -n "$DELIVERY_TASK_JSON" \
            && test -n "$DELIVERY_EXPECTED_TASK_ID" \
            && test -n "$DELIVERY_IDEMPOTENCY_KEY" \
            && test -z "$DELIVERY_QUERY_TASK_ID"; then
            modes=$((modes + 1))
          fi
          if test -z "$DELIVERY_TASK_JSON" \
            && test -z "$DELIVERY_EXPECTED_TASK_ID" \
            && test -z "$DELIVERY_IDEMPOTENCY_KEY" \
            && test -n "$DELIVERY_QUERY_TASK_ID"; then
            modes=$((modes + 1))
          fi
          test "$modes" = 1
      - name: Validate without printing the task body
        if: inputs.query_task_id == ''
        run: pnpm validate:task
      - name: Read safe Task and Agent action inventory
        if: inputs.query_task_id == ''
        env:
          DELIVERY_EXPECTED_TASK_ID: ${{ inputs.expected_task_id }}
          DELIVERY_CONTROL_PLANE_ORIGIN: https://delivery-loop-control-plane.eve55265.workers.dev
          DELIVERY_TASK_INTAKE_TOKEN: ${{ secrets.TASK_INTAKE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DELIVERY_EXPECTED_TASK_ID" =~ ^task_[a-f0-9]{56}$ ]]
          test -n "$DELIVERY_TASK_INTAKE_TOKEN"
          task_response="$RUNNER_TEMP/task-before.json"
          task_status="$(curl --silent --show-error --max-time 20 \
            --output "$task_response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $DELIVERY_TASK_INTAKE_TOKEN" \
            --header 'Accept: application/json' \
            "$DELIVERY_CONTROL_PLANE_ORIGIN/v1/tasks/$DELIVERY_EXPECTED_TASK_ID")"
          task_not_found=false
          if test "$task_status" = 404 && jq -e '.error.code == "not_found"' "$task_response" >/dev/null; then
            task_not_found=true
          fi

          suffix="${DELIVERY_EXPECTED_TASK_ID#task_}"
          expected_title="delivery-loop/analysis-run_${suffix}-1"
          action_count="$(gh api --paginate --slurp \
            'repos/evilstar9527/delivery-loop/actions/runs?event=workflow_dispatch&per_page=100' \
            | jq --arg title "$expected_title" \
              '[.[].workflow_runs[] | select(.display_title == $title)] | length')"
          test "$task_status" = 404
          test "$action_count" = 0
          jq -n --arg taskId "$DELIVERY_EXPECTED_TASK_ID" \
            --arg expectedAgentTitle "$expected_title" \
            --arg taskStatus "$task_status" \
            --argjson taskNotFound "$task_not_found" \
            --argjson stableAgentActions "$action_count" \
            '{taskId:$taskId, taskStatus:$taskStatus, taskNotFound:$taskNotFound,
              expectedAgentTitle:$expectedAgentTitle, stableAgentActions:$stableAgentActions}'

      - name: Submit the validated Task exactly once
        if: inputs.query_task_id == ''
        env:
          DELIVERY_EXPECTED_TASK_ID: ${{ inputs.expected_task_id }}
          DELIVERY_IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          DELIVERY_CONTROL_PLANE_ORIGIN: https://delivery-loop-control-plane.eve55265.workers.dev
          DELIVERY_TASK_INTAKE_TOKEN: ${{ secrets.TASK_INTAKE_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$DELIVERY_EXPECTED_TASK_ID" =~ ^task_[a-f0-9]{56}$ ]]
          [[ "$DELIVERY_IDEMPOTENCY_KEY" =~ ^[A-Za-z0-9._:-]{1,200}$ ]]
          task_file="$RUNNER_TEMP/task.json"
          response_file="$RUNNER_TEMP/task-response.json"
          jq -er '.inputs.task_json' "$GITHUB_EVENT_PATH" > "$task_file"
          chmod 600 "$task_file"
          status="$(curl --silent --show-error --max-time 30 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $DELIVERY_TASK_INTAKE_TOKEN" \
            --header "Idempotency-Key: $DELIVERY_IDEMPOTENCY_KEY" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data-binary "@$task_file" \
            "$DELIVERY_CONTROL_PLANE_ORIGIN/v1/tasks")"
          test "$status" = 202
          jq -e --arg taskId "$DELIVERY_EXPECTED_TASK_ID" \
            --arg runId "run_${DELIVERY_EXPECTED_TASK_ID#task_}" \
            '.accepted == true and .taskId == $taskId and .runId == $runId
             | {accepted:true, taskId:$taskId, runId:$runId}' \
            "$response_file"

      - name: Read safe current Task and Plan state
        if: inputs.query_task_id != ''
        env:
          DELIVERY_QUERY_TASK_ID: ${{ inputs.query_task_id }}
          DELIVERY_CONTROL_PLANE_ORIGIN: https://delivery-loop-control-plane.eve55265.workers.dev
          DELIVERY_TASK_INTAKE_TOKEN: ${{ secrets.TASK_INTAKE_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$DELIVERY_QUERY_TASK_ID" =~ ^task_[a-f0-9]{56}$ ]]
          test -n "$DELIVERY_TASK_INTAKE_TOKEN"
          run_id="run_${DELIVERY_QUERY_TASK_ID#task_}"
          task_response="$RUNNER_TEMP/task-state.json"
          plan_response="$RUNNER_TEMP/plan-state.json"
          task_status="$(curl --silent --show-error --max-time 20 \
            --output "$task_response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $DELIVERY_TASK_INTAKE_TOKEN" \
            --header 'Accept: application/json' \
            "$DELIVERY_CONTROL_PLANE_ORIGIN/v1/tasks/$DELIVERY_QUERY_TASK_ID")"
          plan_status="$(curl --silent --show-error --max-time 20 \
            --output "$plan_response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $DELIVERY_TASK_INTAKE_TOKEN" \
            --header 'Accept: application/json' \
            "$DELIVERY_CONTROL_PLANE_ORIGIN/v1/runs/$run_id/plan")"
          test "$task_status" = 200
          test "$plan_status" = 200
          jq -n --slurpfile task "$task_response" --slurpfile plan "$plan_response" '
            {
              task: {
                id: $task[0].task.id,
                revision: $task[0].task.source.revision,
                kind: $task[0].task.intent.kind,
                repository: $task[0].task.target.repository,
                baseBranch: $task[0].task.target.baseBranch
              },
              run: {
                id: $task[0].run.id,
                state: $task[0].run.state,
                version: $task[0].run.version,
                baseSha: $task[0].run.baseSha,
                activePlan: $task[0].run.activePlan,
                quota: $task[0].run.quota
              },
              plan: ($plan[0].plan | {id, version, digest, baseSha, status}),
              items: [$plan[0].items[] | {
                id, kind, title, objective, doneWhen,
                required, status, progressVersion,
                effects, commandRefs, evidenceKinds
              }],
              attempts: [$plan[0].attempts[] | {
                id, mode, status, baseSha, headBranch, headSha,
                version, leaseGeneration, heartbeatAt, result,
                githubRunId, githubStatus, githubConclusion,
                githubObservedAt, githubObservationVersion
              }],
              evidence: [$plan[0].evidence[] | {
                id, attemptId, planId, planVersion, planItemId,
                kind, status, commandRef, exitCode, durationMs,
                sha, url, artifactDigest, verificationStatus, observedAt
              }]
            }'
